<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Mi Portafolio</title>
</head>
<body>

  <!-- Requisito 7 y 12: Barra de navegación -->
  <nav id="navbar">
    <!-- Requisito 8: Enlace que comienza con # -->
    <a href="#welcome-section">Sobre mí</a>
    <a href="#projects">Proyectos</a>
    <a href="#contact">Contacto</a>
  </nav>

  <main>
    <!-- Requisito 1 y 2: Sección de bienvenida con h1 -->
    <section id="welcome-section">
      <h1>Hola, soy un Desarrollador</h1>
      <p>Bienvenido a mi portafolio personal.</p>
    </section>

    <!-- Requisito 4: Sección de proyectos -->
    <section id="projects">
      <div id="project-section">
        <h2>Mis Proyectos</h2>
        
        <!-- Requisito 5 y 6: Clase project-tile y un enlace <a> -->
        <div class="project-tile">
          <a href="https://ejemplo.com" target="_blank">Proyecto 1</a>
        </div>
      </div>
    </section>

    <section id="contact">
      <!-- Requisito 9 y 10: ID profile-link y target="_blank" -->
      <a id="profile-link" href="https://github.com/tu-usuario" target="_blank">Visita mi GitHub</a>
    </section>
  </main>

</body>
</html>
